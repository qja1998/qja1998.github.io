<text x="78" y="386" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#22272e" text-anchor="start" font-weight="400">head 하나의 차원을 512 / 8 = 64로 줄였기 때문에 8개를 다 합쳐도 계산량은 512짜리 한 개일 때와 비슷하다. 대신 서로 다른 표현 공간에서 동시에 볼 수 있다.</text>
