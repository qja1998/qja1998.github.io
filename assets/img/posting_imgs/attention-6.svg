<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Bahdanau와 Luong의 계산 경로 차이">
<title>Bahdanau와 Luong의 계산 경로 차이</title>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68707d"/></marker>
  <marker id="ar_att" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
  <marker id="ar_enc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  <marker id="ar_dec" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
  <marker id="ar_bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
</defs>
<rect width="900" height="380" rx="10" fill="#fcfcfd" stroke="#e4e7ec" stroke-width="1"/>
<text x="450" y="38" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#22272e" text-anchor="middle" font-weight="700">같은 시점 t에서, 무엇을 기준으로 점수를 매기는가</text>
<text x="58" y="92" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#7c2d12" text-anchor="start" font-weight="700">Bahdanau (2015)</text>
<rect x="132" y="108" width="128" height="46" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.6"/>
<text x="196.0" y="135.9" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="600">s(t-1)</text>
<rect x="290" y="108" width="128" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="354.0" y="135.9" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="600">a(t)</text>
<line x1="264" y1="131.0" x2="286" y2="131.0" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar_att)"/>
<rect x="448" y="108" width="128" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="512.0" y="135.9" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="600">c(t)</text>
<line x1="422" y1="131.0" x2="444" y2="131.0" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar_att)"/>
<rect x="606" y="108" width="128" height="46" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.6"/>
<text x="670.0" y="135.9" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="600">s(t)</text>
<line x1="580" y1="131.0" x2="602" y2="131.0" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar_att)"/>
<text x="742" y="180" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#68707d" text-anchor="start" font-weight="400"></text>
<text x="132" y="190" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#68707d" text-anchor="start" font-weight="400">직전 상태 s(t-1)로 점수를 매긴다. c(t)가 나와야 비로소 s(t)를 만들 수 있으므로, attention이 디코더 RNN 안쪽에 끼어 있다.</text>
<line x1="58" y1="216" x2="842" y2="216" stroke="#e4e7ec" stroke-width="1.2" stroke-linecap="round"/>
<text x="58" y="250" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#7c2d12" text-anchor="start" font-weight="700">Luong (2015)</text>
<rect x="132" y="266" width="128" height="46" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.6"/>
<text x="196.0" y="293.9" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="600">h(t)</text>
<rect x="290" y="266" width="128" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="354.0" y="293.9" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="600">a(t)</text>
<line x1="264" y1="289.0" x2="286" y2="289.0" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar_att)"/>
<rect x="448" y="266" width="128" height="46" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="512.0" y="293.9" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="600">c(t)</text>
<line x1="422" y1="289.0" x2="444" y2="289.0" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar_att)"/>
<rect x="606" y="266" width="128" height="46" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.6"/>
<text x="670.0" y="293.9" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="600">h_att(t)</text>
<line x1="580" y1="289.0" x2="602" y2="289.0" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar_att)"/>
<text x="742" y="338" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#68707d" text-anchor="start" font-weight="400"></text>
<text x="132" y="348" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#68707d" text-anchor="start" font-weight="400">먼저 이번 시점 상태 h(t)를 만든 뒤 점수를 매긴다. attention이 RNN 바깥의 후처리가 되어 경로가 더 단순하다. h_att(t)는 context를 반영해 새로 만든 상태다.</text>
</svg>
