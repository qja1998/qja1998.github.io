<rect x="62" y="328" width="776" height="56" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2" opacity="0.75"/>
<text x="80" y="349" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#14532d" text-anchor="start" font-weight="700">달라진 점</text>
<text x="80" y="368" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#14532d" text-anchor="start" font-weight="400">context를 하나만 만들지 않고 디코더 시점마다 c1, c2, c3, … 를 새로 만든다. “고프다”를 낼 때는 h3(hungry)을 크게 본다.</text>
