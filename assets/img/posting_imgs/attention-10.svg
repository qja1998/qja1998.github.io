<rect x="624" y="162" width="30" height="30" rx="7" fill="#fef9c3" stroke="#eab308" stroke-width="1.3"/>
<text x="639" y="183" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#713f12" text-anchor="middle" font-weight="700">K</text>
