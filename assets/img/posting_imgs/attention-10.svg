<text x="682" y="182" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#22272e" text-anchor="start" font-weight="400">인코더 출력</text>
<rect x="624" y="202" width="30" height="30" rx="7" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
<text x="639" y="223" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">V</text>
<line x1="660" y1="217" x2="674" y2="217" stroke="#68707d" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="682" y="222" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#22272e" text-anchor="start" font-weight="400">인코더 출력</text>
<line x1="624" y1="268" x2="846" y2="268" stroke="#e4e7ec" stroke-width="1.1" stroke-linecap="round"/>
<text x="624" y="292" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#22272e" text-anchor="start" font-weight="400">예전 Seq2Seq attention이</text>
<text x="624" y="311" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#22272e" text-anchor="start" font-weight="400">하던 일과 같은 자리다.</text>
<text x="450" y="372" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#68707d" text-anchor="middle" font-weight="400">세 자리 모두 계산 방법은 똑같은 Scaled Dot-Product Attention이다. 달라지는 것은 Q·K·V를 어디에서 가져오는지, 그리고 가리는지 여부뿐이다.</text>
<text x="450" y="400" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#68707d" text-anchor="middle" font-weight="400">Masked self-attention은 아직 만들지 않은 뒷단어를 미리 보지 못하게 막아, 학습과 실제 생성이 같은 조건이 되게 한다.</text>
</svg>
