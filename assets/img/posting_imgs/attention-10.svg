<text x="735.0" y="105" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="400" opacity="0.8">디코더가 인코더를 봄</text>
