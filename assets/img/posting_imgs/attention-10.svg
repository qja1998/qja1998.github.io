<text x="461.0" y="105" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" fill="#7c2d12" text-anchor="middle" font-weight="400" opacity="0.8">디코더 층 안</text>
