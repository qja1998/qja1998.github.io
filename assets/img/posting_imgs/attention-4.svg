<text x="417" y="362" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" fill="#68707d" text-anchor="middle" font-weight="400">모두 더하면 1</text>
<line x1="486" y1="322" x2="514" y2="322" stroke="#68707d" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="518" y="300" width="116" height="44" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="576.0" y="326.375" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="600">c(t) = Σ α·h</text>
<line x1="638" y1="322" x2="666" y2="322" stroke="#68707d" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="670" y="300" width="172" height="44" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.6"/>
<text x="756.0" y="326.025" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="middle" font-weight="600">s(t) = f(s(t-1), y(t-1), c(t))</text>
<text x="756" y="362" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" fill="#68707d" text-anchor="middle" font-weight="400">context를 받아 다음 상태를 만든다</text>
<text x="450" y="412" font-family="'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11.5" fill="#9aa2ad" text-anchor="middle" font-weight="400">인코더는 양방향 RNN을 쓰고, 정방향·역방향 상태를 이어 붙인 것을 h(j)로 쓴다</text>
